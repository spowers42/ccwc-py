# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  source:
    desc: Source the uv environment for the project.
    cmds:
      - source .venv/bin/activate
    silent: true

  format:
    desc: Format the code with Ruff
    cmds:
      - ruff format .
    silent: true

  test_unit:
    desc: Run unit tests
    cmds:
      - pytest tests/unit/ -vv
    silent: true

  test:
    desc: Run all tests
    deps: [test_unit]
